<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="A pixel-art ARPG: hunt loot, speak Rhunewords, and leave the goose alone." />
    <meta property="og:title" content="Dungeon of Rhune" />
    <meta property="og:image" content="./og-image.jpg" />
    <title>Dungeon of Rhune</title>
    <style>
        /* Boot cover: inlined so the screen is dark from the very first paint. */
        html, body { margin: 0; background: #000; }
        #boot-cover {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #000;
            opacity: 1;
            transition: opacity 0.35s ease-out;
            pointer-events: none;
        }
        #boot-cover.hidden { opacity: 0; }
    </style>
</head>
<body>
    <div id="boot-cover"></div>
    <script src="./boot-safety.js"></script>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
</body>
</html>
