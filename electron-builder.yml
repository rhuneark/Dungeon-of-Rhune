# Desktop packaging for Steam. `npm run dist:win` / `dist:linux` / `dist:mac`
# produce plain app folders in release/ — exactly what SteamPipe uploads
# (Steam does its own install/update, so no installers are needed).
appId: com.rhuneark.dungeonofrhune
productName: Dungeon of Rhune
copyright: Copyright © 2026 rhuneark
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - desktop/main.cjs
  - desktop/preload.cjs
  - desktop/steam.config.json
  - package.json
asar: true
# Steam delivers updates; don't generate an auto-updater config.
publish: null
# steamworks.js ships native .node binaries + the Steam API libraries; they
# must live outside the asar archive to be loadable.
asarUnpack:
  - node_modules/steamworks.js/**
electronLanguages:
  - en-US
win:
  target: dir
  icon: build/icon.png
  # Editing the .exe icon/metadata from Linux/macOS needs Wine; build the
  # Windows depot on Windows (or CI) to get the branded .exe.
  signAndEditExecutable: true
linux:
  target: dir
  icon: build/icon.png
  category: Game
  executableName: dungeon-of-rhune
mac:
  target: dir
  icon: build/icon.png
  category: public.app-category.role-playing-games
